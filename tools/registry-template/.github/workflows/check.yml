# Checks every pull request's index.json with check.vyrn.
name: Check the index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vyrn
        run: curl -fsSL https://raw.githubusercontent.com/dmccottrell/vyrn/main/install.sh | sh
      - name: Check index.json
        run: ~/.vyrn/bin/vyrn run check.vyrn
