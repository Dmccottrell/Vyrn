# Runs on every push and pull request: the test suite on Linux, macOS and
# Windows, lints, the formatter, the editor extension's tests, and the
# WebAssembly runtime.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --check
      - name: Clippy (Python and C bridges included)
        run: cargo clippy --locked --all-targets --features python,ffi -- -D warnings
      - name: Vyrn formatting of the examples
        run: cargo run --locked -q -- fmt --check examples tests/fixtures
      - name: Bridges
        run: cargo test --locked --features python,ffi --test bridges

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - name: VS Code extension and language server
        run: node editors/vscode/test.js
      - name: The npm package installs and runs vyrn
        env:
          VYRN_BINARY_PATH: target/debug/vyrn
        run: node npm/vyrn/test.js
      - name: The VS Code extension packages for the Marketplace
        working-directory: editors/vscode
        run: |
          npm install --omit=dev --no-audit --no-fund
          npx --yes @vscode/vsce package -o /tmp/vyrn.vsix

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WebAssembly runtime
        working-directory: runtime/wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Run it under Node
        working-directory: runtime/wasm
        run: node test.mjs

  embed:
    name: embedding library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/embed
      - name: Clippy and formatting
        working-directory: runtime/embed
        run: |
          cargo fmt --check
          cargo clippy --locked --release -- -D warnings
      - name: C tests (the C API, and the Unreal scripts against a fake Unreal)
        if: runner.os != 'Windows'
        run: runtime/embed/tests/run.sh
      - name: Build vyrn.dll
        if: runner.os == 'Windows'
        working-directory: runtime/embed
        run: cargo build --locked --release
      - name: Vyrn checks of the Unreal scripts
        run: cargo run --locked -q -- fmt --check unreal/VyrnScripting/Scripts
