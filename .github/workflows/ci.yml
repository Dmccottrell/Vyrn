# Runs on every push and pull request: the test suite on Linux, macOS and
# Windows, lints, the formatter, the editor extension's tests, and the
# WebAssembly runtime.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --check
      - name: Clippy (Python and C bridges included)
        run: cargo clippy --locked --all-targets --features python,ffi -- -D warnings
      - name: Vyrn formatting of the examples
        run: cargo run --locked -q -- fmt --check examples tests/fixtures
      - name: Bridges
        run: cargo test --locked --features python,ffi --test bridges

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --locked
      - name: VS Code extension and language server
        run: node editors/vscode/test.js

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WebAssembly runtime
        working-directory: runtime/wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Run it under Node
        working-directory: runtime/wasm
        run: node test.mjs
