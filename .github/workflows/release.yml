# Pushing a tag such as `v0.4.0` builds `vyrn` for every platform and
# publishes a GitHub release with the archives (which `install.sh` and
# `install.ps1` download), the bare programs (which the npm package
# downloads), the Unreal plugin and the VS Code extension. With the
# secrets NPM_TOKEN, VSCE_PAT and OVSX_PAT set, it also publishes to npm,
# the VS Code Marketplace and Open VSX (see docs/publishing.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name=vyrn-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/vyrn "$name/"
          cp README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          # The bare program, for the npm package, named like the archive.
          rm -rf "$name"
          cp target/${{ matrix.target }}/release/vyrn "$name"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "vyrn-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/vyrn.exe $name/
          Copy-Item README.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          # The bare program, for the npm package.
          Copy-Item target/${{ matrix.target }}/release/vyrn.exe "$name.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: vyrn-*

  unreal:
    name: Unreal plugin (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: Win64 }
          - { os: ubuntu-latest, platform: Linux }
          - { os: macos-latest, platform: Mac }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies (sound)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build the Vyrn runtime library
        working-directory: runtime/embed
        run: cargo build --locked --release
      - name: Package the plugin, library included
        shell: pwsh
        run: |
          $name = "VyrnScripting-${{ github.ref_name }}-${{ matrix.platform }}"
          $plugin = "$name/VyrnScripting"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item -Recurse unreal/VyrnScripting $plugin
          Copy-Item runtime/embed/include/vyrn.h "$plugin/Source/ThirdParty/Vyrn/include/"
          $lib = "$plugin/Source/ThirdParty/Vyrn/${{ matrix.platform }}"
          switch ("${{ matrix.platform }}") {
            "Win64" { Copy-Item runtime/embed/target/release/vyrn.dll, runtime/embed/target/release/vyrn.dll.lib $lib }
            "Linux" { Copy-Item runtime/embed/target/release/libvyrn.so $lib }
            "Mac"   { Copy-Item runtime/embed/target/release/libvyrn.dylib $lib }
          }
          Copy-Item unreal/README.md $name/
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: unreal-${{ matrix.platform }}
          path: VyrnScripting-*.zip

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package the extension
        working-directory: editors/vscode
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm install --omit=dev --no-audit --no-fund
          npx --yes @vscode/vsce package -o "../../vyrn-vscode-${GITHUB_REF_NAME}.vsix"
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath "vyrn-vscode-${GITHUB_REF_NAME}.vsix" -p "$VSCE_PAT"
      - name: Publish to Open VSX (VSCodium, Cursor and others)
        if: env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx publish "vyrn-vscode-${GITHUB_REF_NAME}.vsix" -p "$OVSX_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vyrn-vscode-*.vsix

  publish:
    needs: [build, unreal, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum vyrn-* VyrnScripting-* > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "Vyrn ${{ github.ref_name }}" --generate-notes

  npm:
    name: npm package
    # After the release exists, so the package can download its programs.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish vyrn-lang
        if: env.NODE_AUTH_TOKEN != ''
        working-directory: npm/vyrn
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          npm publish --access public --ignore-scripts
