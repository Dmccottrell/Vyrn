# Keeps the Learn Vyrn website up to date. On every push to main that
# changes the course, the site or Vyrn, it rebuilds the site (Vyrn compiled
# to WebAssembly, every lesson checked in it) into site/public and commits
# the result. Vercel, connected to this repository with site/public as the
# root directory, publishes each such commit.
name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "!site/public/**", "src/**", "runtime/wasm/**", "registry/**", "unreal/README.md", "Cargo.toml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            runtime/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Vyrn for the browser
        working-directory: runtime/wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Export the course
        run: cargo run --release --no-default-features -- learn export build/course
      - name: Build the website into site/public
        run: node site/build.mjs build/course/course.json runtime/wasm/target/wasm32-unknown-unknown/release/vyrn_wasm.wasm site/public
      - name: Commit it if it changed
        run: |
          git add site/public
          if git diff --cached --quiet; then
            echo "The website is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild the website"
            git push
          fi
