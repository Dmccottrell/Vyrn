[package]
name = "vyrn"
version = "0.4.0"
edition = "2021"
description = "Compiler front end for the Vyrn programming language"
license = "MIT"

[lib]
name = "vyrn"
path = "src/lib.rs"

[[bin]]
name = "vyrn"
path = "src/main.rs"

[dependencies]
# The module resolver: archives, content hashes, HTTPS.
flate2 = "1"
tar = { version = "0.4", default-features = false }
sha2 = "0.10"
# `use std.re`: regular expressions.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
ureq = { version = "3", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = ["vulkan", "metal", "dx12", "wgsl"] }
pollster = { version = "0.4", optional = true }
# `use python.x`: an embedded CPython.
pyo3 = { version = "0.30", optional = true, features = ["auto-initialize"] }
# `extern "c"`: loading C libraries and calling them by signature.
libloading = { version = "0.9", optional = true }
libffi = { version = "5", optional = true }

[features]
default = ["net", "native", "db"]
# `use std.db`: SQLite databases (not on WebAssembly).
db = ["dep:rusqlite"]
# Compiles typed functions to machine code with Cranelift (not on WebAssembly).
native = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
# Fetching `use "host/owner/repo@version"` modules over HTTPS.
net = ["dep:ureq"]
# Runs tensor work on a real GPU through wgpu (Vulkan, Metal or DirectX 12).
gpu = ["dep:wgpu", "dep:pollster"]
# `use python.numpy`: Python libraries through an embedded CPython.
python = ["dep:pyo3"]
# `extern "c":` blocks: calling C and C++ libraries.
ffi = ["dep:libloading", "dep:libffi"]

# The interactive prompt: line editing and history. Not needed on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustyline = { version = "15", default-features = false, features = ["with-file-history"] }
# `use std.db`: SQLite, compiled in.
rusqlite = { version = "0.42", optional = true, features = ["bundled"] }
# The native tier: typed functions compiled to machine code at load time.
cranelift-codegen = { version = "0.137.1", optional = true }
cranelift-frontend = { version = "0.137.1", optional = true }
cranelift-jit = { version = "0.137.1", optional = true }
cranelift-module = { version = "0.137.1", optional = true }
cranelift-native = { version = "0.137.1", optional = true }
